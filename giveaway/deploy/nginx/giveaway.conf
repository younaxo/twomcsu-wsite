# nginx мини-выкладки розыгрыша. Монтируется как /etc/nginx/conf.d/default.conf (образ nginx-unprivileged).
# Домен giveaway.twomc.su (решение владельца; DNS-запись giveaway в Beget - владелец).
# Сертификаты: /etc/nginx/certs/fullchain.pem и privkey.pem (на хосте - каталог GIVEAWAY_CERTS_DIR вне репозитория).
# Выпуск (ВРУЧНУЮ, не из этого репозитория), например: certbot certonly --standalone -d <домен>
# либо DNS-01; затем скопировать/слинковать fullchain.pem и privkey.pem в каталог сертификатов. Здесь не выполняется.
# Проверка: nginx -t (в контейнере или на хосте с установленным nginx).

server_tokens off;

# Каноничный домен - ЕДИНАЯ переменная для редиректа и заголовка Host к API (не берётся из запроса клиента).
# Домен giveaway.twomc.su: заменять только здесь и в двух server_name ниже.
map $server_port $gw_domain {
    default giveaway.twomc.su;
}

# Лимит запросов на приёмник событий по IP (один сервер MC шлёт пакет раз в ~5 с).
limit_req_zone $binary_remote_addr zone=gw_events:1m rate=10r/s;

upstream giveaway_api {
    server api:4000;
    keepalive 8;
}

# Catch-all: запросы к чужому Host / по IP / без SNI не доходят до API (444 без ответа; TLS-рукопожатие отклоняется
# через ssl_reject_handshake, nginx >= 1.19.4, образ 1.27 подходит; сертификат для него не нужен).
server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# 80 -> 443 (внутри контейнера 8080/8443, наружу 80/443).
server {
    listen 8080;
    server_name giveaway.twomc.su;

    # Место под ACME HTTP-01 (webroot) при необходимости: добавить location /.well-known/acme-challenge/.
    location / {
        return 301 https://$gw_domain$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name giveaway.twomc.su;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Общие настройки прокси. X-Forwarded-For ПЕРЕЗАПИСЫВАЕТСЯ адресом клиента (не $proxy_add_x_forwarded_for):
    # клиент не может подставить свой заголовок, а API (TRUST_PROXY=1, один hop) берёт именно этот адрес.
    # Если перед nginx появится CDN/прокси - менять вместе с TRUST_PROXY.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $gw_domain;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Приёмник событий плагина: тело не больше 64 КБ (как в API), свой лимит запросов.
    location = /api/giveaway/v1/events {
        client_max_body_size 64k;
        limit_req zone=gw_events burst=30 nodelay;
        limit_req_status 429;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://giveaway_api;
    }

    # ЗАГОТОВКА под будущий SSE (потоковые обновления страницы розыгрыша): путь согласовать с API
    # при его реализации; сейчас API ответит 404. Буферизация выключена, таймаут чтения длинный.
    location ^~ /api/giveaway/v1/stream {
        proxy_buffering off;
        proxy_cache off;
        # add_header сервера НЕ наследуется при наличии своего add_header в location - дублируем.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
        proxy_pass http://giveaway_api;
    }

    # Остальные публичные пути розыгрыша (будущие GET-страницы данных).
    location ^~ /api/giveaway/ {
        proxy_read_timeout 30s;
        proxy_pass http://giveaway_api;
    }

    # Всё прочее (в т.ч. /health, /api/auth, /giveaway/v1 без префикса, /uploads) - 404 на уровне nginx.
    location / {
        return 404;
    }
}
