# Плагин розыгрыша «Анархия Новой Эры». Контракт: giveaway/docs/ADR-G001-session-time-counting.md
#
# Ключ сервера (hex) в этот файл НЕ кладётся: он лежит в отдельном файле вне репозитория
# и вне папки плагина с правами только владельца. Выдаёт его владелец сайта.

# Адрес сайта (без пути), например https://twomc.example . Путь /api/giveaway/v1/events плагин добавляет сам.
# Допустим http:// только для localhost. Переменная окружения: GIVEAWAY_API_URL
apiUrl: ""

# Идентификатор этого сервера: ^[a-z0-9][a-z0-9-]{1,31}$ . Переменная окружения: GIVEAWAY_SERVER_ID
serverId: ""

# Версия ключа (1..999999). Переменная окружения: GIVEAWAY_KEY_VERSION
keyVersion: 1

# Путь к файлу с ключом (64 hex-символа). Относительный путь считается от папки плагина.
# Переменная окружения: GIVEAWAY_KEY_FILE
keyFile: ""

# Игрок считается AFK после стольких минут без движения, чата, команды или взаимодействия (1..60).
afkMinutes: 5

# Предел локальной очереди (события сверх предела отбрасываются и считаются в /giveawaytime).
maxQueueEvents: 100000

# Дата старта, дата окончания и порог в часах в этом файле НЕ задаются: плагин берёт их из ответа сайта (POST /progress).
# Служебные настройки (кулдаун /giveaway, опрос прогресса, уведомление) заданы в коде.
