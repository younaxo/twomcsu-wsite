# Закрытый default_server: неизвестные Host не получают ничего. Файл устанавливает setup-nginx.sh
# в /etc/nginx/conf.d/00-default-reject.conf; дистрибутивный sites-enabled/default отключается.
# 80: соединение обрывается без ответа (444). 443: TLS-рукопожатие отклоняется (сертификат не нужен).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
