# TwoMC Bridge: выдача заказов (раздел 14 контракта docs/stage-03/BRIDGE-CONTRACT.md), снимки статистики
# игроков (раздел 15) и инвентаря (раздел 16). Всё по умолчанию ВЫКЛЮЧЕНО.
# Параметры подключения к сайту (siteUrl, keyId, секрет) общие и берутся из секции delivery ниже, даже если
# выдача заказов выключена, а включены только снимки.
# В репозитории здесь ТОЛЬКО плейсхолдеры. Секрет сервера в этот файл НЕ кладётся.

delivery:
  # Выдача заказов. По умолчанию ВЫКЛЮЧЕНА. Включайте только после того, как владелец
  # выдал ключ сервера и включил delivery у сервера на сайте (capabilities.delivery).
  enabled: false

  # Адрес сайта без пути, например https://example.invalid . http допустим только для localhost.
  # Переменная окружения: TWOMC_BRIDGE_URL
  siteUrl: "https://example.invalid"

  # Идентификатор ключа "<slug сервера>.<поколение>", например survival.1 (формат ^[a-z0-9][a-z0-9-]{1,31}\.[1-9][0-9]{0,5}$ (поколение без ведущего нуля)).
  # Переменная окружения: TWOMC_BRIDGE_KEY_ID
  keyId: "survival.1"

  # Секрет сервера (64 hex-символа, вывод `bridge:print-key`, его запускает только владелец) берётся из:
  #  1) переменной окружения TWOMC_BRIDGE_KEY_HEX, либо
  #  2) файла keyFile (первая строка, 64 hex). Относительный путь считается от папки плагина.
  #     Права файла 600, файл вне репозитория. Переменная окружения: TWOMC_BRIDGE_KEY_FILE
  keyFile: "bridge-key.txt"

  # Дополнительные корни команд ЦЕЛИКОМ (любые аргументы; шире и опаснее extraTemplates). Нельзя указывать
  # корни, уже ограниченные шаблонами по умолчанию (lp, luckperms, give, crate, cratekey, eco). Должны совпадать
  # с расширением в настройках сайта. Опасные корни (op, stop, execute, sudo и т.п.) отклоняются всегда.
  extraRoots: []

  # Дополнительные ФОРМЫ команд сверх белого списка по умолчанию (рекомендуемый способ расширения; форма проверяется).
  # Белый список по умолчанию (включён всегда):
  #   lp|luckperms user <ник> parent add|addtemp <группа> [срок]
  #   eco give <ник> <число>
  #   give <ник> <предмет> [кол-во]
  #   crate|cratekey key give <ник> <ключ> [кол-во]   (и cratekey give <ник> <ключ> [кол-во])
  # Синтаксис шаблона: слова через ОДИН пробел; первое слово корень; "a|b" допустимые литералы;
  # {nick} {group} {key} {duration} {int} {qty} {num} {item} типы аргументов; суффикс ? у хвостовых аргументов
  # делает их необязательными. Пример: "kits give {nick} {key}". Запрещённые корни не разрешаются никак.
  # Корень нового шаблона добавьте и в расширение корней в настройках сайта.
  extraTemplates: []

  # Сколько заданий просить за один опрос (1..10).
  maxPerClaim: 5

  # Сколько суток хранить журнал выполненных ключей (не меньше 60). Не короче срока жизни заказа.
  keyRetentionDays: 180

# Снимок статистики игрока (player.stats.snapshot, контракт 15). По умолчанию ВЫКЛЮЧЕН. Включайте только после того,
# как владелец включил приём статистики на сайте (BRIDGE_STATS_ENABLED=true) и выдал серверу возможность player-events:
# иначе сайт отвечает unsupported_type, плагин приостанавливает отправку на 30 минут. Плагин не знает, привязан ли
# игрок: шлёт по UUID, сайт сам решает (для непривязанных ничего не сохраняет).
stats:
  enabled: false
  # Периодический снимок каждого онлайн-игрока не чаще раза в N минут (1..1440), плюс снимок при выходе игрока.
  # Не чаще раза в 30 секунд на игрока в любом случае.
  intervalMinutes: 10
  # Откуда брать kills: player (убийства игроков, PLAYER_KILLS) или all (игроки + мобы).
  kills: player
  # hits: в ванильной статистике нет числа ударов. off (по умолчанию): метрика не отправляется, на сайте не
  # меняется. damage-dealt: отправлять сырое значение Statistic.DAMAGE_DEALT (это суммарный урон, а не число ударов).
  hits: off

# Снимок инвентаря и Ender Chest (inventory.snapshot, контракт 16). По умолчанию ВЫКЛЮЧЕН. Включайте только после того,
# как владелец включил приём инвентаря на сайте (BRIDGE_INVENTORY_ENABLED=true) и выдал серверу возможность
# inventory-sync (player-events её НЕ заменяет). Шлются только поля из белого списка контракта (без NBT и IP).
# Снимок больше 16 КБ не отправляется (в лог пишется размер); отправка частями появится позже.
inventory:
  enabled: false
  # Периодический снимок онлайн-игрока каждые N минут (1..1440), плюс снимок при выходе.
  intervalMinutes: 5
  # Не чаще раза в N секунд на игрока (минимум 30, меньшее значение заменяется на 30).
  minGapSeconds: 30
  # Неизменившийся инвентарь не отправляется повторно, но не реже раза в N минут (не меньше intervalMinutes).
  heartbeatMinutes: 30
