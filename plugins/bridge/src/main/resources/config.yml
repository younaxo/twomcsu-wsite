# TwoMC Bridge, срез «выдача заказов». Контракт: docs/stage-03/BRIDGE-CONTRACT.md, раздел 14.
# В репозитории здесь ТОЛЬКО плейсхолдеры. Секрет сервера в этот файл НЕ кладётся.

delivery:
  # Выдача заказов. По умолчанию ВЫКЛЮЧЕНА. Включайте только после того, как владелец
  # выдал ключ сервера и включил delivery у сервера на сайте (capabilities.delivery).
  enabled: false

  # Адрес сайта без пути, например https://example.invalid . http допустим только для localhost.
  # Переменная окружения: TWOMC_BRIDGE_URL
  siteUrl: "https://example.invalid"

  # Идентификатор ключа "<slug сервера>.<поколение>", например survival.1 (формат ^[a-z0-9][a-z0-9-]{1,31}\.[0-9]{1,6}$).
  # Переменная окружения: TWOMC_BRIDGE_KEY_ID
  keyId: "survival.1"

  # Секрет сервера (64 hex-символа, вывод `bridge:print-key`, его запускает только владелец) берётся из:
  #  1) переменной окружения TWOMC_BRIDGE_KEY_HEX, либо
  #  2) файла keyFile (первая строка, 64 hex). Относительный путь считается от папки плагина.
  #     Права файла 600, файл вне репозитория. Переменная окружения: TWOMC_BRIDGE_KEY_FILE
  keyFile: "bridge-key.txt"

  # Дополнительные корни команд ЦЕЛИКОМ (любые аргументы; шире и опаснее extraTemplates). Нельзя указывать
  # корни, уже ограниченные шаблонами по умолчанию (lp, luckperms, give, crate, cratekey, eco). Должны совпадать
  # с расширением в настройках сайта. Опасные корни (op, stop, execute, sudo и т.п.) отклоняются всегда.
  extraRoots: []

  # Дополнительные ФОРМЫ команд сверх белого списка по умолчанию (рекомендуемый способ расширения; форма проверяется).
  # Белый список по умолчанию (включён всегда):
  #   lp|luckperms user <ник> parent add|addtemp <группа> [срок]
  #   eco give <ник> <число>
  #   give <ник> <предмет> [кол-во]
  #   crate|cratekey key give <ник> <ключ> [кол-во]   (и cratekey give <ник> <ключ> [кол-во])
  # Синтаксис шаблона: слова через ОДИН пробел; первое слово корень; "a|b" допустимые литералы;
  # {nick} {group} {key} {duration} {int} {qty} {num} {item} типы аргументов; суффикс ? у хвостовых аргументов
  # делает их необязательными. Пример: "kits give {nick} {key}". Запрещённые корни не разрешаются никак.
  # Корень нового шаблона добавьте и в расширение корней в настройках сайта.
  extraTemplates: []

  # Сколько заданий просить за один опрос (1..10).
  maxPerClaim: 5

  # Сколько суток хранить журнал выполненных ключей (не меньше 60). Не короче срока жизни заказа.
  keyRetentionDays: 180
